[workspace]
resolver = "3"
members = ["shared", "gate", "vault", "tools", "cli", "integration"]
default-members = ["shared", "gate", "vault", "tools", "cli"]

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
luoto-shared = { path = "shared" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
futures-util = "0.3"

hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
lru = "0.19"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
psl = "2"
idna = "1"
ipnet = "2"
graphql-parser = "0.4"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
subtle = "2"
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "p256", "rsa"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
hex = "0.4"
libc = "0.2"
time = "0.3"

clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
directories = "6"
open = "5"
keyring = "4"
axum = { version = "0.8", features = ["tokio", "tracing"] }
tower-http = { version = "0.7", features = ["set-header"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
rusqlite = { version = "0.41", features = ["bundled"] }

tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
