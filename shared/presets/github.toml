description = "GitHub reads: clone/fetch public repos, API reads, raw files (release downloads: github-releases)"

[[rule]]
host = "github.com"

[[rule]]
host = "github.com"
access = ["POST"]
paths = ["/*/*/git-upload-pack", "/*/*.git/git-upload-pack"]
max_body = 16777216
note = "git fetch negotiates with a POST; the body goes only to GitHub"

[[rule]]
host = "api.github.com"

[[rule]]
host = "codeload.github.com"

[[rule]]
host = "raw.githubusercontent.com"

[[rule]]
host = "cli.github.com"
note = "GitHub CLI apt/rpm packages"
