description = "OpenAI Codex CLI"
command = "codex"
yolo = ["--dangerously-bypass-approvals-and-sandbox"]
headless = ["exec", "--dangerously-bypass-approvals-and-sandbox", "{prompt}"]
providers = ["openai"]
install = ["mkdir -p ~/.local && npm install -g --prefix ~/.local @openai/codex"]
install_hosts = ["registry.npmjs.org"]
tools = { node = "lts" }
briefing = ["~/.codex/AGENTS.md"]
mcp = "codex"

[settings.model]
file = "~/.codex/config.toml"
path = ["model"]

[settings.effort]
file = "~/.codex/config.toml"
path = ["model_reasoning_effort"]
values = ["minimal", "low", "medium", "high", "xhigh"]
