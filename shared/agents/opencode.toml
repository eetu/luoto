description = "OpenCode"
command = "opencode"
providers = ["anthropic", "openai", "openrouter", "gemini"]
headless = ["run", "{prompt}"]
# The installer puts the binary in ~/.opencode/bin and only edits shell rc files.
install = [
  "curl -fsSL https://opencode.ai/install | bash",
  "mkdir -p ~/.local/bin && ln -sf ~/.opencode/bin/opencode ~/.local/bin/opencode",
]
install_hosts = ["opencode.ai", "github.com", "api.github.com", "objects.githubusercontent.com", "release-assets.githubusercontent.com"]
env = { OPENCODE_DISABLE_AUTOUPDATE = "1", OPENCODE_DISABLE_SHARE = "1" }
briefing = ["~/.config/opencode/AGENTS.md"]
mcp = "opencode"

# Model catalogue.

[settings.model]
file = "~/.config/opencode/opencode.json"
path = ["model"]

[[rule]]
host = "models.dev"

[[rule]]
host = "models.opencode.ai"

# Model servers: a provider each beside the cloud ones, all in its model picker (OpenCode
# bundles the OpenAI-compatible SDK); the one it starts on gives the default model.
[model_server]
api = "openai"
endpoint = "/v1/chat/completions"
switch = "its model picker (`/models`), the cloud's models beside them"
each = [
  { file = "~/.config/opencode/opencode.json", path = ["provider", "{name}", "npm"], value = "@ai-sdk/openai-compatible" },
  { file = "~/.config/opencode/opencode.json", path = ["provider", "{name}", "name"], value = "{name}" },
  { file = "~/.config/opencode/opencode.json", path = ["provider", "{name}", "options", "baseURL"], value = "{url}/v1" },
  { file = "~/.config/opencode/opencode.json", path = ["provider", "{name}", "options", "apiKey"], value = "{token}" },
  { file = "~/.config/opencode/opencode.json", path = ["provider", "{name}", "models", "{model}"], value = {} },
  { file = "~/.config/opencode/opencode.json", path = ["provider", "{name}", "models", "{model}", "limit", "context"], value = "{context:n}" },
]
default = [
  { file = "~/.config/opencode/opencode.json", path = ["model"], value = "{name}/{model}" },
]
