description = "GitHub Copilot CLI (untested)"
command = "copilot"
yolo = ["--yolo"]
# What a luoto.toml can't pass: tools, paths and URLs allowed without asking.
prompt_flags = ["--allow-all-tools", "--allow-all-paths", "--allow-all-urls", "--allow-all", "--allow-tool", "--allow-url"]
headless = ["{args}", "-p", "{prompt}", "--allow-all-tools"]
providers = ["copilot"]
install = ["mkdir -p ~/.local && npm install -g --prefix ~/.local @github/copilot"]
install_hosts = ["registry.npmjs.org"]
tools = { node = "lts" }
env = { COPILOT_AUTO_UPDATE = "false" }
briefing = ["~/.copilot/instructions/luoto.instructions.md"]
mcp = "copilot"
