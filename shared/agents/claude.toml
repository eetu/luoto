description = "Claude Code"
command = "claude"
yolo = ["--dangerously-skip-permissions"]
# What a luoto.toml can't pass: these change, or let settings change, its permission prompts.
prompt_flags = ["--permission-mode", "--allow-dangerously-skip-permissions", "--allowedTools", "--allowed-tools", "--settings"]
# `{args}` first: an option that takes a list (`--tools`) ends at `-p`.
headless = ["{args}", "-p", "--dangerously-skip-permissions", "--output-format", "text", "{prompt}"]
providers = ["anthropic"]
install = ["curl -fsSL https://claude.ai/install.sh | bash"]
install_hosts = ["claude.ai", "downloads.claude.ai", "storage.googleapis.com"]
env = { CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1", DISABLE_AUTOUPDATER = "1" }
briefing = []
mcp = "claude"

# Its first start asks for a text style, shows security notes and notices, then asks whether
# to trust the workspace; the sandbox is the boundary, and the workspace is the user's own
# project. The text style is the user's choice: `theme` in
# ~/.config/luoto/home/.claude/settings.json.
[[first_run]]
file = "~/.claude.json"
path = ["hasCompletedOnboarding"]
value = true

[[first_run]]
file = "~/.claude.json"
path = ["projects", "/workspace", "hasTrustDialogAccepted"]
value = true

# The one-time notice that auto mode became the default permission mode.
[[first_run]]
file = "~/.claude.json"
path = ["hasSeenAutoDefaultNotice"]
value = true

# Its state for its terminal (OSC 7501, which terminals that show agents' status read and
# others ignore): working once a prompt is in, blocked on a question or a permission, done at
# the end of a turn. Beside the user's own hooks.
[[status]]
file = "~/.claude/settings.json"
path = ["hooks", "UserPromptSubmit"]
append = true
value = { hooks = [{ type = "command", command = "/opt/luoto/bin/sandbox state working --app claude-code" }] }

[[status]]
file = "~/.claude/settings.json"
path = ["hooks", "Notification"]
append = true
value = { hooks = [{ type = "command", command = "/opt/luoto/bin/sandbox state blocked --app claude-code" }] }

[[status]]
file = "~/.claude/settings.json"
path = ["hooks", "Stop"]
append = true
value = { hooks = [{ type = "command", command = "/opt/luoto/bin/sandbox state done --app claude-code" }] }

# What `[agents.claude]` sets in an env (`model`, `effort`): Claude's user settings, under a
# `/model` or `/effort` chosen in a session.
[settings.model]
file = "~/.claude/settings.json"
path = ["model"]

[settings.effort]
file = "~/.claude/settings.json"
path = ["effortLevel"]
values = ["low", "medium", "high", "xhigh"]

# First-run onboarding checks that the OAuth host answers, whatever the auth kind.
[[rule]]
host = "platform.claude.com"
paths = ["/v1/oauth/hello"]

# A model server it starts on (`[agents.claude] model_server`): one endpoint per session, so
# its model aliases all name the server's model.
[model_server]
api = "anthropic"
endpoint = "/v1/messages"
default = [
  { file = "~/.claude/settings.json", path = ["env", "ANTHROPIC_BASE_URL"], value = "{url}" },
  { file = "~/.claude/settings.json", path = ["env", "ANTHROPIC_AUTH_TOKEN"], value = "{token}" },
  { file = "~/.claude/settings.json", path = ["env", "ANTHROPIC_DEFAULT_OPUS_MODEL"], value = "{model}" },
  { file = "~/.claude/settings.json", path = ["env", "ANTHROPIC_DEFAULT_SONNET_MODEL"], value = "{model}" },
  { file = "~/.claude/settings.json", path = ["env", "ANTHROPIC_DEFAULT_HAIKU_MODEL"], value = "{model}" },
  # It knows the window of Claude models only.
  { file = "~/.claude/settings.json", path = ["env", "CLAUDE_CODE_MAX_CONTEXT_TOKENS"], value = "{context}" },
  { file = "~/.claude/settings.json", path = ["model"], value = "{model}" },
]
