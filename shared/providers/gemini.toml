description = "Google Gemini API (OpenCode, …)"
host = "generativelanguage.googleapis.com"
suggested = "api_key"

[[deny]]
paths = ["/upload/**", "/v1beta/files", "/v1beta/files/**", "/v1beta/cachedContents/**", "/v1beta/batches/**"]
reason = "file upload, cache and batch endpoints of the Gemini API are not reachable from the sandbox"

[auth.api_key]
label = "Gemini API key"
short = "from Google AI Studio (aistudio.google.com/apikey)"
prefix = "AIza"
how = "aistudio.google.com/apikey > Create API key (it starts with AIza). On the free tier Google may use prompts to improve its products."
header = "x-goog-api-key"
format = "{secret}"
query = "key"
env = { GEMINI_API_KEY = "AIzaSyLuotoPlaceholder0000000000000000000" }

# Server tools: the provider reaches the network for the request. Refused unless the env sets
# `server_tools = true` under [credentials.gemini].
[[server_tool]]
what = "URL context"
paths = ["/v1beta/models/*", "/v1/models/*", "/v1beta/tunedModels/*", "/v1beta/interactions"]
tool_keys = ["url_context", "urlContext"]
tool_types = ["url_context"]

[[server_tool]]
what = "a remote MCP server"
paths = ["/v1beta/interactions"]
tool_types = ["mcp_server"]
