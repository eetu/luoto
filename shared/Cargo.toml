[package]
name = "luoto-shared"
description = "Types and policy engine shared by the luoto CLI, gate, vault and sandbox helper"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
toml.workspace = true
psl.workspace = true
idna.workspace = true
ipnet.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }

[features]
# The tun link of an env without a network card (gate and sandbox helper, Linux only).
tun = ["dep:libc"]
