# A launchpad: a repository that holds only this file (and mise.toml), committed so that
# `luoto init` in a clone of it gives everyone the same env, its repos beside it at
# /workspace/<name>. `luoto init --repo ~/dev/<name>` uses a local checkout of one instead.

presets = ["npm", "terraform"]
agents = ["claude"]
ports = [5173]

[repos.api]
url = "https://github.com/acme/api.git"                   # or just `acme/api` on GitHub

[repos.web]
url = "https://github.com/acme/web.git"
branch = "develop"                                        # default: the remote's

[repos.infra]
url = "https://dev.azure.com/acme/Platform/_git/infra"    # Azure DevOps

[repos.design-system]
url = "https://github.com/acme-oss/design-system.git"     # another GitHub owner

# Each developer's credentials go in their own env config (`luoto edit`); `luoto init` prints
# what these remotes need. What the team expects can be listed here:
# [needs]
# credentials = ["anthropic"]
